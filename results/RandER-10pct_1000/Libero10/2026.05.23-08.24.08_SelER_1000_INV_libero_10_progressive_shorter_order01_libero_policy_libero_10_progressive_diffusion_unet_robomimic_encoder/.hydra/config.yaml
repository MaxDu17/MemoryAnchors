output_layout:
  hydra_run_dir: ${output_dir_prefix}/${date_stamp}-${run_name_hydra}
  hydra_sweep_dir: ${output_dir_prefix}/${date_stamp}-${run_name_hydra}
  multi_run_dir: ${output_dir_prefix}/${date_stamp}-${run_name_multi}
exp_name: SelER_1000_INV_libero_10_progressive_shorter_order01
group_tag: LiberoNonTIMM
task_name: ${task.name}
output_dir_prefix: FINAL_EXPERIMENTS/SelectiveERStandardSuite_INVERT10_1000/Libero10
_target_: umi_day.train_network.workspace.cl_train_policy_workspace.TrainPolicyWorkspace
shape_meta: ${task.shape_meta}
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
logging:
  project: LiberoSimple
  resume: false
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${exp_name}_${name}_${task_name}_${model.name}
  tags:
  - ${name}
  - ${task_name}
  - ${exp_name}
  - ${group_tag}
  id: null
  group: null
date_stamp: ${now:%Y.%m.%d}
time_stamp: ${now:%H.%M.%S}
run_name_hydra: ${time_stamp}_${exp_name}_${name}_${task_name}_${model.name}
run_name_multi: ${time_stamp}_${name}_${task_name}_${model.name}_${exp_name}
training:
  separate_process_eval_output: file
  spawn_eval_process: false
  debug: false
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_proportion: 0.05
  reset_optimizer_per_task: false
  max_train_steps: null
  max_val_steps: null
  num_epochs: ${eval:'${task.number_tasks} * ${task.epochs_per_task} if ${task.sequential}
    else 50'}
  resume: false
  rollout_every: 20
  rollout_enabled: true
  separate_process_eval: true
  separate_process_gpu: 6
  sample_every: 1
  sample_min_size: 5
  seed: 3
  tqdm_interval_sec: 1.0
  use_ema: true
  freeze_encoder: false
  val_every: 15
  mixed_precision: 'no'
  log_grad_norm_every: 50
  clip_grad_norm: 100.0
  pretrained_checkpoint_path: null
multi_run:
  run_dir: ${output_layout.multi_run_dir}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${exp_name}_${name}_${task_name}_${model.name}
task:
  low_dim_obs_horizon: 2
  img_obs_horizon: 2
  action_horizon: 16
  include_file_filters: []
  use_finetuned_language_encoder: false
  lang_embedding_mlp_cfg: null
  shape_meta:
    image_resolution: 224
    prompt_sequence_length: 768
    max_prompt_full_demos: 1
    prompt_chunk_n_actions: 10
    max_sequence_length: 520
    use_prompting: false
    prompt_sample_mode: pair
    action:
      horizon: ${task.action_horizon}
      down_sample_steps: 1
      type: low_dim
      shape:
      - 10
      rep: absolute
    obs:
      agentview_rgb:
        horizon: ${task.img_obs_horizon}
        down_sample_steps: 1
        shape:
        - 3
        - 224
        - 224
        type: rgb
        prompt_type: observation
      eye_in_hand_rgb:
        horizon: ${task.img_obs_horizon}
        down_sample_steps: 1
        shape:
        - 3
        - 224
        - 224
        type: rgb
        prompt_type: observation
      ee_pos:
        shape:
        - 3
        type: low_dim
        horizon: ${task.low_dim_obs_horizon}
        down_sample_steps: 1
        prompt_type: proprioception
      ee_ori:
        shape:
        - 6
        type: low_dim
        horizon: ${task.low_dim_obs_horizon}
        down_sample_steps: 1
        prompt_type: proprioception
      gripper_states:
        shape:
        - 2
        type: low_dim
        horizon: ${task.low_dim_obs_horizon}
        down_sample_steps: 1
        prompt_type: proprioception
      task_language:
        shape:
        - 768
        type: low_dim
        horizon: 1
        is_language: true
        prompt_type: ignore
  language_embedding:
    _target_: umi_day.train_network.model.language.language_embedding.LanguageEmbedding
    model_name: sentence-transformers/sentence-t5-base
  env_runner:
    _target_: umi_day.train_network.env_runner.libero_image_runner.LiberoImageRunner
    language_embedding:
      _target_: umi_day.train_network.model.language.language_embedding.LanguageEmbedding
      model_name: sentence-transformers/sentence-t5-base
    use_finetuned_language_encoder: ${task.use_finetuned_language_encoder}
    text_encoder_model_name: ${oc.select:model.obs_encoder.text_encoder_model_name,null}
    crf: 22
    fps: 10
    max_steps: 500
    n_envs: 10
    n_test: 50
    n_test_vis: 10
    n_train: 0
    n_train_vis: 0
    render_obs_key:
    - agentview_image
    - robot0_eye_in_hand_image
    test_start_seed: 100000
    tqdm_interval_sec: 1.0
    shape_meta: ${shape_meta}
    include_file_filters: ${..include_file_filters}
    exec_action_horizon: 12
    vis_prompt: false
    vis_actions_rollout: false
    vis_proprio_rollout: false
    vis_trajectory_video: false
    replay_dataset_action: false
    vis_attention_map: false
    vis_env_index: 0
    run_train_config: true
    save_sim_states: false
    dataset_path: datasets/libero_abs/libero_10
    multi_bddl_path: deps/LIBERO/libero/libero/bddl_files/libero_10
  eval_image_transforms:
    _target_: umi_day.train_network.common.augmentation.ImageAugmentation
    shape_meta: ${shape_meta}
    transforms:
    - type: CenterCrop
      ratio: 0.95
  train_image_transforms:
    _target_: umi_day.train_network.common.augmentation.ImageAugmentation
    shape_meta: ${shape_meta}
    transforms:
    - type: RandomCrop
      ratio: 0.95
    - _target_: torchvision.transforms.ColorJitter
      brightness: 0.3
      contrast: 0.4
      saturation: 0.5
      hue: 0.08
  sequential: true
  epochs_per_task: 80
  number_tasks: ${eval:'len(${task.dataset.task_order})'}
  evals_per_task: 1
  dataset:
    _target_: umi_day.train_network.dataset.libero_replay_image_dataset.LiberoSequentialTaskDataset
    shape_meta: ${shape_meta}
    action_padding: true
    language_embedding:
      _target_: umi_day.train_network.model.language.language_embedding.LanguageEmbedding
      model_name: sentence-transformers/sentence-t5-base
    seed: 42
    use_cache: true
    overwrite_cache: false
    val_ratio: 0.1
    sample_type: task
    max_segments: -1
    name_suffix: ''
    include_file_filters: ${..include_file_filters}
    use_finetuned_language_encoder: ${task.use_finetuned_language_encoder}
    text_encoder_model_name: ${oc.select:model.obs_encoder.text_encoder_model_name,null}
    dataset_path: datasets/libero_abs/libero_10
    task_order: ${..testing_tasks}
  name: libero_10_progressive
  dataset_path: datasets/libero_abs/libero_10
  tasks_to_evaluate:
  - LIVING_ROOM_SCENE2_put_both_the_alphabet_soup_and_the_tomato_sauce_in_the_basket_demo
  - LIVING_ROOM_SCENE2_put_both_the_cream_cheese_box_and_the_butter_in_the_basket_demo
  - KITCHEN_SCENE3_turn_on_the_stove_and_put_the_moka_pot_on_it_demo
  - KITCHEN_SCENE4_put_the_black_bowl_in_the_bottom_drawer_of_the_cabinet_and_close_it_demo
  - LIVING_ROOM_SCENE5_put_the_white_mug_on_the_left_plate_and_put_the_yellow_and_white_mug_on_the_right_plate_demo
  - STUDY_SCENE1_pick_up_the_book_and_place_it_in_the_back_compartment_of_the_caddy_demo
  - LIVING_ROOM_SCENE6_put_the_white_mug_on_the_plate_and_put_the_chocolate_pudding_to_the_right_of_the_plate_demo
  - LIVING_ROOM_SCENE1_put_both_the_alphabet_soup_and_the_cream_cheese_box_in_the_basket_demo
  - KITCHEN_SCENE8_put_both_moka_pots_on_the_stove_demo
  - KITCHEN_SCENE6_put_the_yellow_and_white_mug_in_the_microwave_and_close_it_demo
  task_order_index: 1
  task_order_permutation: null
  testing_tasks: ${oc.create:${libero_task_order:${.tasks_to_evaluate},${.task_order_index},${.task_order_permutation}}}
  preload_dataset: null
name: libero_policy
checkpoint:
  save_last_ckpt: false
  save_last_snapshot: false
  save_ckpt_each_task_end: true
  save_every_n_epochs: -1
  topk:
    monitor_key: test_mean_score
    format_str: epoch={epoch:04d}-${.monitor_key}={${.monitor_key}:.3f}.ckpt
    k: 0
    mode: max
model:
  _target_: umi_day.train_network.policy.diffusion_unet_timm_policy.DiffusionUnetTimmPolicy
  name: diffusion_unet_robomimic_encoder
  shape_meta: ${shape_meta}
  noise_scheduler:
    _target_: diffusers.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: epsilon
  obs_encoder:
    _target_: umi_day.train_network.model.vision.robomimic_diffusion_obs_encoder.RobomimicDiffusionObsEncoder
    shape_meta: ${shape_meta}
    embed_size: 64
    num_kp: 32
    resnet_type: 18
    resnet_pretrained: false
    observation_horizon: ${task.img_obs_horizon}
    language_key: task_language
    language_mlp:
      input_size: 768
      hidden_size: 128
      num_layers: 1
    train_image_transforms: ${...task.train_image_transforms}
    eval_image_transforms: ${...task.eval_image_transforms}
    gn_features_per_group: 16
  num_inference_steps: 16
  obs_as_global_cond: true
  diffusion_step_embed_dim: 256
  down_dims:
  - 256
  - 512
  - 1024
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  input_pertub: 0.1
  train_diffusion_n_samples: 1
learning_algorithm:
  _target_: umi_day.train_network.continual_learning_algos.SelectiveER.SelectiveEpisodicReplay
  base_learner: ${model}
  filter_size: 1000
  filter_size_mode: examples
  batch_size: ${dataloader.batch_size}
  num_workers: ${dataloader.num_workers}
  preload_dataset: ${task.preload_dataset}
  add_new_data: true
  er_weight: 1
  selection_mode: nearest_neighbor_ood
  representation_cfg:
    individually_normalized: false
    use_select_keys: false
    keep_modalities:
    - agentview_rgb
    - eye_in_hand_rgb
  selection_cfg:
    id_partition: true
    noise_level: 20
    std_cutoff: 2
    n_neighbors: 5
    consolidation: median
    random_proportion: 0.9
    invert_selection: true
    invert_remove_proportion: 0.1
    ramp_task_contribution: false
    ramp_prop: 0.5
    counterexample: false
    counterexample_cfg:
      orthogonal_task_shift: false
      orthogonal_travel_scale: 0.3
      ramp_rate: 1
_name_: libero_policy_dunet_robomimic_selectiveer
dataloader:
  batch_size: 16
  num_workers: 16
  persistent_workers: false
  pin_memory: true
  shuffle: true
val_dataloader:
  batch_size: 16
  num_workers: 16
  persistent_workers: false
  pin_memory: true
  shuffle: false
optimizer:
  lr: 0.0001
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.0001

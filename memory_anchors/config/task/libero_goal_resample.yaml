# Fig. 2B ("performance variance across different ER samples"): start from a RandER checkpoint
# taken after the first 8 LIBERO-Goal tasks (order 0), train the 9th task (Bowl to Plate) and
# vary only the seed, i.e. the random ER buffer sample. Requires
#   training.pretrained_checkpoint_path=<RandER run>/checkpoints/task8_turn_on_the_stove_demo.ckpt
# See experiments/buffer_resampling.sh.
defaults:
  - libero_defaults

name: libero_goal
dataset_path: &dataset_path ${data_root:}/libero_abs/libero_goal
include_file_filters: []

# Tasks 1-8 of order 0: they form the replay pool (loaded as preload_dataset).
pretraining_tasks: [
  "open_the_middle_drawer_of_the_cabinet_demo",
  "put_the_bowl_on_the_stove_demo",
  "put_the_wine_bottle_on_top_of_the_cabinet_demo",
  "open_the_top_drawer_and_put_the_bowl_inside_demo",
  "put_the_bowl_on_top_of_the_cabinet_demo",
  "push_the_plate_to_the_front_of_the_stove_demo",
  "put_the_cream_cheese_in_the_bowl_demo",
  "turn_on_the_stove_demo",
]
# The new task trained from the checkpoint.
testing_tasks: [
  "put_the_bowl_on_the_plate_demo",
]

dataset:
  _target_: memory_anchors.dataset.libero_replay_image_dataset.LiberoSequentialTaskDataset
  dataset_path: *dataset_path
  val_ratio: 0.10
  task_order: ${..testing_tasks}
  include_file_filters: ${..include_file_filters}

preload_dataset:
  _target_: memory_anchors.dataset.libero_replay_image_dataset.LiberoMultiTaskDataset
  dataset_path: *dataset_path
  shape_meta: ${shape_meta}
  action_padding: true
  language_embedding: ${..language_embedding}
  seed: 42
  use_cache: false
  overwrite_cache: false
  val_ratio: 0.10
  sample_type: task
  max_segments: -1
  name_suffix: ""
  include_file_filters: ${..pretraining_tasks}

env_runner:
  dataset_path: *dataset_path
  multi_bddl_path: ${libero_bddl_dir:libero_goal}

sequential: true
epochs_per_task: 50
evals_per_task: 8          # dense evaluation along the single fine-tuning task
number_tasks: ${eval:'len(${task.dataset.task_order})'}
use_finetuned_language_encoder: false

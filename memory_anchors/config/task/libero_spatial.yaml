# LIBERO-Spatial: 10 tasks learned in sequence.
defaults:
  - libero_defaults

name: libero_spatial
dataset_path: &dataset_path ${data_root:}/libero_abs/libero_spatial
include_file_filters: []

# Canonical LIBERO task order; task_order_index selects one of LIBERO's 21 benchmark
# permutations of it (the paper uses orders 0, 1, 2).
tasks_to_evaluate: [
  "pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_next_to_the_ramekin_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_from_table_center_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_on_the_cookie_box_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_in_the_top_drawer_of_the_wooden_cabinet_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_on_the_ramekin_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_next_to_the_cookie_box_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_on_the_stove_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_next_to_the_plate_and_place_it_on_the_plate_demo",
  "pick_up_the_black_bowl_on_the_wooden_cabinet_and_place_it_on_the_plate_demo"
]
task_order_index: 0
task_order_permutation: null
testing_tasks: ${oc.create:${libero_task_order:${.tasks_to_evaluate},${.task_order_index},${.task_order_permutation}}}

preload_dataset: null

dataset:
  _target_: memory_anchors.dataset.libero_replay_image_dataset.LiberoSequentialTaskDataset
  dataset_path: *dataset_path
  task_order: ${..testing_tasks}
  val_ratio: 0.10
  include_file_filters: ${..include_file_filters}

env_runner:
  dataset_path: *dataset_path
  multi_bddl_path: ${libero_bddl_dir:libero_spatial}

sequential: true
epochs_per_task: 50
evals_per_task: 1          # evaluate once at the end of each task (plus the untrained step-0 checkpoint)
number_tasks: ${eval:'len(${task.dataset.task_order})'}
use_finetuned_language_encoder: false

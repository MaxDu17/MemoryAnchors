# U-Net diffusion policy with a robomimic-style ResNet-18 + spatial-softmax image encoder and a
# language MLP over precomputed sentence-T5 instruction embeddings (App. B.2).
_target_: memory_anchors.policy.diffusion_unet_timm_policy.DiffusionUnetTimmPolicy
name: diffusion_unet_robomimic_encoder

shape_meta: ${shape_meta}

noise_scheduler:
  _target_: diffusers.DDIMScheduler
  num_train_timesteps: 50
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  clip_sample: True
  set_alpha_to_one: True
  steps_offset: 0
  prediction_type: epsilon

obs_encoder:
  _target_: memory_anchors.model.vision.robomimic_diffusion_obs_encoder.RobomimicDiffusionObsEncoder
  shape_meta: ${shape_meta}
  embed_size: 64
  num_kp: 32
  resnet_type: 18               # 18 / 34 / 50 / 101; the paper uses 18 trained from scratch
  resnet_pretrained: False
  observation_horizon: ${task.img_obs_horizon}
  language_key: task_language
  language_mlp:
    input_size: 768
    hidden_size: 128
    num_layers: 1
  train_image_transforms: ${...task.train_image_transforms}
  eval_image_transforms: ${...task.eval_image_transforms}
  gn_features_per_group: 16

num_inference_steps: 16
obs_as_global_cond: True
diffusion_step_embed_dim: 256
down_dims: [256, 512, 1024]
kernel_size: 5
n_groups: 8
cond_predict_scale: True
input_pertub: 0.1
train_diffusion_n_samples: 1

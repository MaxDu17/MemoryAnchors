# Top-level config for every MemoryAnchors experiment (paper hyperparameters, App. B.2).
#
#   python memory_anchors/train.py task=libero_goal method=anchor_removal task.task_order_index=0
#
# Pick the suite with `task=` (config/task) and the ER method with `method=` (config/method).
# Buffer size: learning_algorithm.filter_size (+ filter_size_mode=examples|prop).
defaults:
  - task: libero_goal
  - model: diffusion_unet_robomimic_encoder
  - learning_algorithm: anchor_er
  - method: rand_er
  - _self_

_target_: memory_anchors.workspace.train_workspace.TrainPolicyWorkspace

name: memory_anchors
exp_name: default
group_tag: default
task_name: ${task.name}
output_dir_prefix: ${repo_root:}/outputs   # runs go to <output_dir_prefix>/<date>-<time>_<exp_name>

shape_meta: ${task.shape_meta}

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

dataloader:
  batch_size: 16          # new-task samples per step; the ER buffer adds another 16 replay samples
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 16
  num_workers: 8
  persistent_workers: false
  pin_memory: true
  shuffle: false

optimizer:                # AdamW
  lr: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-4

training:
  seed: 3                 # all paper runs use seed 3; variation comes from task.task_order_index
  debug: false
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_proportion: 0.05   # cosine schedule (5% warmup) is restarted at every task boundary
  reset_optimizer_per_task: false
  max_train_steps: null
  max_val_steps: null
  num_epochs: ${eval:'${task.number_tasks} * ${task.epochs_per_task} if ${task.sequential} else 50'}
  resume: false
  resume_checkpoint_path: null
  rollout_every: 20       # non-sequential only; sequential runs use task.evals_per_task
  rollout_enabled: true
  # Evaluation is done out-of-process: training writes checkpoints/<global_step>.ckpt at each
  # evaluation point and scripts/evaluate_runs.py rolls them out later (or in parallel).
  separate_process_eval: true
  spawn_eval_process: false     # true: also launch the eval subprocess from the training job
  separate_process_gpu: 0       # GPU used by eval subprocesses when spawn_eval_process=true
  separate_process_eval_output: file   # file | terminal
  sample_every: 1
  sample_min_size: 5
  tqdm_interval_sec: 1.0
  use_ema: true
  freeze_encoder: false
  val_every: 15
  mixed_precision: 'no'
  log_grad_norm_every: 50
  clip_grad_norm: 100.0
  pretrained_checkpoint_path: null   # start from a checkpoint (used by the buffer-resampling experiment)

checkpoint:
  save_last_ckpt: false
  save_last_snapshot: false
  save_ckpt_each_task_end: true      # checkpoints/task<i>_<task>.ckpt (needed by analysis/anchor_concentration.py)
  save_every_n_epochs: -1
  topk:
    monitor_key: test_mean_score
    format_str: epoch={epoch:04d}-${.monitor_key}={${.monitor_key}:.3f}.ckpt
    k: 0                             # top-k checkpointing disabled
    mode: max

logging:
  project: memory_anchors
  resume: false
  mode: offline                      # set logging.mode=online to sync to Weights & Biases
  name: ${now:%Y.%m.%d-%H.%M.%S}_${exp_name}
  tags: ["${task_name}", "${exp_name}", "${group_tag}"]
  id: null
  group: null

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir_prefix}/${now:%Y.%m.%d-%H.%M.%S}_${exp_name}
  sweep:
    dir: ${output_dir_prefix}/${now:%Y.%m.%d-%H.%M.%S}_${exp_name}
    subdir: ${hydra.job.num}
